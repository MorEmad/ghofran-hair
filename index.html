  <!-- ============================================================
       التحويل التلقائي — يعمل قبل رسم الصفحة حتى لا يرى
       مستخدم الجوال أي وميض قبل فتح المتجر.
       ============================================================ -->
  <script>
    (function () {
      var PLAY_URL = "https://play.google.com/store/apps/details?id=com.dwsiq.ghofran_beauty&hl=ar";
      var IOS_URL = "https://apps.apple.com/us/app/ghofran-hair/id6758272617";

      var ua = navigator.userAgent || navigator.vendor || window.opera || "";

      // 1) لا نحوّل الزواحف وبوتات المعاينة، وإلا انكسرت معاينة الرابط
      //    في واتساب وفيسبوك وتعطّلت الأرشفة في جوجل.
      var BOTS = /bot|crawler|spider|crawling|slurp|facebookexternalhit|facebot|whatsapp|telegram|twitterbot|linkedinbot|discordbot|embedly|quora link preview|pinterest|redditbot|slackbot|skypeuripreview|vkshare|applebot|google-inspectiontool|adsbot|chrome-lighthouse|gtmetrix|headlesschrome/i;
      if (BOTS.test(ua)) return;

      // 2) منفذ هروب لمعاينة الصفحة على الجوال أثناء الاختبار:
      //    أضف ‎?stay=1‎ أو ‎#stay‎ إلى الرابط.
      if (/[?&]stay=1/.test(location.search) || location.hash === "#stay") return;

      var isAndroid = /android/i.test(ua) && !/windows phone/i.test(ua);

      // iPadOS 13+ يرسل User-Agent الخاص بـ Mac، فنكشفه عبر اللمس.
      var isIOS = /iPad|iPhone|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      // replace وليس href: حتى لا نحبس المستخدم في زر الرجوع.
      if (isAndroid) location.replace(PLAY_URL);
      else if (isIOS) location.replace(IOS_URL);
    })();
  </script>

    .card {

      padding: 44px 32px 32px;
      text-align: center;
      box-shadow: var(--shadow);
      animation: rise .5s cubic-bezier(.2, .7, .3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: none; }
    }

    @media (prefers-reduced-motion: reduce) {

    h1 {

      background-clip: text;
      color: transparent;
    }

    .tagline {

      max-width: 34ch;
      font-size: 16px;
      line-height: 1.85;
      color: var(--text-muted);
      font-weight: 400;
    }

    .divider {

      align-items: center;
      gap: 14px;
      margin: 0 0 22px;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(to left, transparent, var(--border), transparent);
    }

    .stores {

      gap: 12px;

    /* شارات المتاجر الرسمية */
    .badge {

      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--badge-fg);
      text-decoration: none;
      direction: ltr;
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }

    .badge:hover,
    .badge:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 12px 26px -10px rgba(0, 0, 0, .55);
    }

    .badge:active { transform: translateY(0); opacity: .88; }

    .badge:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

    .badge svg { flex: 0 0 auto; }

    .badge-text {
